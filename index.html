<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI E-District Portal | उत्तर प्रदेश शासन</title>
    <style>
        :root {
            --bg-color: #05050A;
            --card-bg: rgba(15, 15, 25, 0.85);
            --primary: #00f3ff;
            --secondary: #ff00ff;
            --text: #e0e0e0;
            --input-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(0, 243, 255, 0.3);
            --success: #00ff88;
            --danger: #ff3366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 243, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.15) 0%, transparent 40%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            z-index: -1;
            animation: bgMove 20s ease-in-out infinite alternate;
        }

        @keyframes bgMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-5%, -5%) rotate(5deg); }
        }

        .screen { display: none; animation: fadeIn 0.5s ease-out; }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 20px rgba(0, 243, 255, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2.neon-text {
            text-align: center;
            font-size: 28px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #ccc; }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            background: rgba(255, 255, 255, 0.1);
        }

        input:disabled, select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: rgba(0,0,0,0.3);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--primary), #0088ff);
            color: #000;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover { box-shadow: 0 0 20px var(--primary); transform: translateY(-2px); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border);
            color: var(--primary);
        }
        .btn-secondary:hover { background: rgba(0, 243, 255, 0.2); }

        .btn-danger {
            background: rgba(255, 51, 102, 0.2);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container { padding: 40px; max-width: 1200px; margin: 0 auto; }

        .form-card { max-width: 800px; margin: 0 auto; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group.full-width { grid-column: 1 / -1; }

        .radio-group { display: flex; gap: 20px; padding-top: 10px; }
        .radio-group label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 16px; }

        .hidden-input { display: none; margin-top: 10px; }

        .checkbox-group { display: flex; flex-direction: column; gap: 10px; }
        .checkbox-group label { display: flex; align-items: center; gap: 10px; cursor: pointer; }

        .glass-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .glass-table th, .glass-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .glass-table th {
            background: rgba(0, 243, 255, 0.1);
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
        }

        .glass-table tr:hover { background: rgba(255,255,255,0.05); }

        .empty-state { text-align: center; padding: 50px; color: #666; font-size: 18px; }

        .photo-preview {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            border: 2px solid var(--border);
            object-fit: cover;
            margin-top: 10px;
            background: #222;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 15px; text-align: center; padding: 20px; }
            .container { padding: 20px; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen" class="screen active">
        <div class="login-container">
            <div class="card">
                <h2 class="neon-text">AI E-District Portal</h2>
                <p class="subtitle">उत्तर प्रदेश शासन | Secure Access</p>
                <div class="input-group">
                    <label>Username (आईडी)</label>
                    <input type="text" id="username" value="admin" />
                </div>
                <div class="input-group">
                    <label>Password (पासवर्ड)</label>
                    <input type="password" id="password" value="admin" />
                </div>
                <button onclick="login()" class="btn btn-primary">ENTER MATRIX</button>
            </div>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard" class="screen">
        <header>
            <h1>सामान्य निवास प्रमाण पत्र पोर्टल</h1>
            <button onclick="showList()" class="btn btn-secondary">View Applications</button>
        </header>
        
        <div class="container">
            <div class="card form-card">
                <h2 class="neon-text" style="margin-bottom: 30px; font-size: 24px;">Application Form (आवेदन फॉर्म)</h2>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>जिला (District)</label>
                        <select id="district" onchange="updateTehsils()"></select>
                    </div>
                    <div class="form-group">
                        <label>तहसील (Tehsil)</label>
                        <input type="text" id="tehsil" list="tehsil-list" placeholder="Type or Select" />
                        <datalist id="tehsil-list"></datalist>
                    </div>

                    <div class="form-group full-width">
                        <label>क्षेत्र का प्रकार (Area Type)</label>
                        <div class="radio-group">
                            <label><input type="radio" name="areaType" value="gramin" checked onchange="toggleArea()"> ग्रामीण (Rural)</label>
                            <label><input type="radio" name="areaType" value="nagar" onchange="toggleArea()"> नगर (Urban)</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>मोहल्ला (Mohalla)</label>
                        <input type="text" id="mohalla" placeholder="e.g. ग्राम व पोस्ट- भेलउर" />
                    </div>
                    <div class="form-group">
                        <label>ग्राम (Village)</label>
                        <input type="text" id="gram" placeholder="e.g. भेलउर" />
                    </div>
                    <div class="form-group">
                        <label>थाना (Thana)</label>
                        <input type="text" id="thana" placeholder="e.g. एकौना" />
                    </div>

                    <div class="form-group">
                        <label>आवेदक का नाम (Applicant Name)</label>
                        <input type="text" id="applicantName" value="गौतम गुप्ता/Gautam Gupta" />
                    </div>
                    <div class="form-group">
                        <label>पिता का नाम (Father's Name)</label>
                        <input type="text" id="fatherName" value="श्रवण गुप्ता" />
                    </div>

                    <div class="form-group">
                        <label>माता का नाम (Mother's Name)</label>
                        <input type="text" id="motherName" value="विमला देवी" />
                    </div>
                    <div class="form-group">
                        <label>जारी दिनांक (Issue Date)</label>
                        <input type="date" id="issueDate" />
                    </div>

                    <div class="form-group">
                        <label>अधिकारी का नाम (Officer Name)</label>
                        <input type="text" id="officerName" value="Raj Kumar Gupta" />
                    </div>
                    <div class="form-group">
                        <label>फोटो अपलोड (Upload Photo)</label>
                        <input type="file" id="photoUpload" accept="image/*" onchange="handlePhotoUpload(event)" />
                        <img id="photoPreview" class="photo-preview" style="display:none;" />
                    </div>

                    <div class="form-group full-width" style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
                        <h3 style="color: var(--primary); margin-bottom: 15px;">Number Generation Settings</h3>
                        <div class="checkbox-group">
                            <label><input type="checkbox" id="manualAppNo" onchange="toggleManualInputs()"> Manual Application Number</label>
                            <input type="text" id="appNoInput" class="hidden-input" placeholder="Enter App No (e.g. 2619000201123456)" />
                        </div>
                        <div class="checkbox-group" style="margin-top: 15px;">
                            <label><input type="checkbox" id="manualCertNo" onchange="toggleManualInputs()"> Manual Certificate Number</label>
                            <input type="text" id="certNoInput" class="hidden-input" placeholder="Enter Cert No (e.g. 60226212345)" />
                        </div>
                    </div>
                </div>

                <button onclick="submitForm()" class="btn btn-primary" style="margin-top: 30px;">SUBMIT & GENERATE</button>
            </div>
        </div>
    </div>

    <!-- List Screen -->
    <div id="listScreen" class="screen">
        <header>
            <h1>Generated Certificates</h1>
            <button onclick="showDashboard()" class="btn btn-secondary">+ New Application</button>
        </header>
        <div class="container">
            <div id="listContainer"></div>
        </div>
    </div>

                opt.textContent = dist;

                distSelect.appendChild(opt);

            document.getElementById('issueDate').valueAsDate = new Date();

            const dist = document.getElementById('district').value;

            datalist.innerHTML = '';
            
            if (districtData[dist]) {

                    opt.value = t;
                    datalist.appendChild(opt);

                if (dist === "देवरिया") {

            }

        function generateAppNo() {
            let base = "2619000201";
            let used = JSON.parse(localStorage.getItem('usedAppNos') || '[]');
            let suffix;
            do {
                suffix = Math.floor(100000 + Math.random() * 900000).toString();
            } while (used.includes(base + suffix));
            used.push(base + suffix);
            localStorage.setItem('usedAppNos', JSON.stringify(used));
            return base + suffix;
        }

        function generateCertNo() {
            let base = "602262";
            let used = JSON.parse(localStorage.getItem('usedCertNos') || '[]');
            let suffix;
            do {
                suffix = Math.floor(10000 + Math.random() * 90000).toString();
            } while (used.includes(base + suffix));
            used.push(base + suffix);
            localStorage.setItem('usedCertNos', JSON.stringify(used));
            return base + suffix;
        }

            if(!dateStr) return "17/09/2026";
            const d = new Date(dateStr);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }
