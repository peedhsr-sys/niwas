<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Smart Print Portal - UP Residence Certificate</title>
<style>
  :root {
    --primary: #00f2ff;
    --secondary: #7000ff;
    --glass: rgba(255, 255, 255, 0.07);
    --glass-border: rgba(255, 255, 255, 0.15);
    --text: #ffffff;
  }
  body {
    margin: 0;
    font-family: 'Segoe UI', 'Arial Unicode MS', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    z-index: -1;
    animation: float 12s infinite ease-in-out;
  }
  .orb1 { width: 500px; height: 500px; background: var(--secondary); top: -150px; left: -150px; opacity: 0.6; }
  .orb2 { width: 400px; height: 400px; background: var(--primary); bottom: -100px; right: -100px; animation-delay: -6s; opacity: 0.5; }
  
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, 60px) scale(1.1); }
  }

  .container { max-width: 900px; margin: 40px auto; padding: 20px; }

  .glass-card {
    background: var(--glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 0 30px rgba(255,255,255,0.05);
    transform-style: preserve-3d;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }
  
  .glass-card:hover {
    transform: translateY(-8px) rotateX(2deg) rotateY(1deg);
    box-shadow: 0 20px 50px 0 rgba(0, 242, 255, 0.2), inset 0 0 30px rgba(255,255,255,0.1);
  }

  h1, h2 {
    text-align: center;
    background: linear-gradient(90deg, var(--primary), #fff, var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 30px;
    font-size: 2.2rem;
    text-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
  }

  .form-group { margin-bottom: 20px; }
  label { display: block; margin-bottom: 8px; font-weight: 600; color: #a0a0ff; font-size: 0.95rem; }

  input, select {
    width: 100%;
    padding: 14px 16px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    transition: all 0.3s;
    box-sizing: border-box;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
    background: rgba(0, 0, 0, 0.5);
  }

  .btn {
    background: linear-gradient(90deg, var(--secondary), var(--primary));
    border: none;
    padding: 14px 32px;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(0, 242, 255, 0.4);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .btn:hover {
    transform: scale(1.05) translateY(-2px);
    box-shadow: 0 8px 30px rgba(0, 242, 255, 0.6);
  }
  .btn:active { transform: scale(0.95); }
  .btn-secondary { background: linear-gradient(90deg, #444, #666); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

  .hidden { display: none !important; }

  .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  .data-table th, .data-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--glass-border); }
  .data-table th { color: var(--primary); font-weight: 600; }
  .data-table tr:hover { background: rgba(255,255,255,0.05); }

  .radio-group, .checkbox-group { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
  .radio-group label, .checkbox-group label { margin: 0; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  input[type="radio"], input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }

  #photoPreview {
    width: 100px; height: 100px; object-fit: cover; margin-top: 10px; 
    border-radius: 12px; display: none; border: 2px solid var(--primary);
    box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
  }

  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; left: 0; top: 0; width: 100%; background: white; color: black; }
  }
</style>
</head>
<body>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>

  <!-- Login View -->
  <div id="login-view" class="container">
    <div class="glass-card" style="max-width: 420px; margin: 80px auto; text-align: center;">
      <h1>AI Print Portal</h1>
      <p style="color: #ccc; margin-bottom: 30px; font-size: 1.1rem;">उत्तर प्रदेश सामान्य निवास प्रमाण पत्र सिस्टम</p>
      <div class="form-group">
        <input type="text" id="login-id" placeholder="User ID" value="admin">
      </div>
      <div class="form-group">
        <input type="password" id="login-pass" placeholder="Password" value="admin">
      </div>
      <button class="btn" onclick="login()" style="width: 100%; margin-top: 10px;">लॉगिन करें</button>
    </div>
  </div>

  <!-- Dashboard View -->
  <div id="dashboard-view" class="container hidden">
    <div class="glass-card" style="text-align: center;">
      <h1>डैशबोर्ड</h1>
      <p style="color: #a0a0ff; margin-bottom: 30px;">स्वागत है, अधिकारी जी</p>
      <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
        <button class="btn" onclick="showForm()">➕ नया आवेदन बनाएं</button>
        <button class="btn btn-secondary" onclick="showList()">📋 आवेदन सूची देखें</button>
      </div>
    </div>
  </div>

  <!-- Form View -->
  <div id="form-view" class="container hidden">
    <div class="glass-card">
      <h2>प्रमाण पत्र आवेदन फॉर्म</h2>
      <form id="cert-form" onsubmit="event.preventDefault(); submitForm();">
        <div class="form-group">
          <label>जिला (District)</label>
          <select id="district" onchange="updateTehsilOptions()"></select>
        </div>
        <div class="form-group">
          <label>तहसील (Tehsil) <small style="color: var(--primary);">(चुनें या स्वयं लिखें)</small></label>
          <input type="text" id="tehsil" list="tehsil-list" placeholder="तहसील चुनें या लिखें">
          <datalist id="tehsil-list"></datalist>
        </div>
        
        <div class="form-group">
          <label>क्षेत्र प्रकार</label>
          <div class="radio-group">
            <label><input type="radio" name="areaType" value="ग्रामीण" checked onchange="toggleAreaType()"> ग्रामीण</label>
            <label><input type="radio" name="areaType" value="नगर" onchange="toggleAreaType()"> नगर</label>
          </div>
        </div>

        <div id="rural-fields">
          <div class="form-group">
            <label>मोहल्ला / ग्राम व पोस्ट</label>
            <input type="text" id="mohalla" value="ग्राम व पोस्ट- भेलउर">
          </div>
          <div class="form-group">
            <label>ग्राम</label>
            <input type="text" id="gram" value="भेलउर">
          </div>
          <div class="form-group">
            <label>थाना</label>
            <input type="text" id="thana" value="एकौना">
          </div>
        </div>

        <div class="form-group">
          <label>जारी दिनांक <small style="color: var(--primary);">(एक जगह भरें, सब जगह सेट होगा)</small></label>
          <input type="date" id="issueDate">
        </div>

        <div class="form-group">
          <label>आवेदक का नाम</label>
          <input type="text" id="applicantName" value="गौतम गुप्ता/Gautam Gupta">
        </div>
        <div class="form-group">
          <label>पिता का नाम</label>
          <input type="text" id="fatherName" value="श्रवण गुप्ता">
        </div>
        <div class="form-group">
          <label>माता का नाम</label>
          <input type="text" id="motherName" value="विमला देवी">
        </div>

        <div class="form-group">
          <label>सक्षम अधिकारी का नाम</label>
          <input type="text" id="officerName" value="Raj Kumar Gupta">
        </div>

        <div class="form-group">
          <label>फोटो अपलोड करें</label>
          <input type="file" id="photoUpload" accept="image/*" onchange="previewPhoto(this)">
          <img id="photoPreview" src="">
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="manualNumbers" onchange="toggleManualNumbers()">
          <label for="manualNumbers">मैन्युअल नंबर दर्ज करें</label>
        </div>

        <div id="auto-numbers">
          <div class="form-group">
            <label>आवेदन क्रमांक (स्वचालित - अंतिम 6 अंक रैंडम)</label>
            <input type="text" id="appNoAuto" readonly style="background: rgba(0,242,255,0.1); color: var(--primary); font-weight: bold; letter-spacing: 1px;">
          </div>
          <div class="form-group">
            <label>प्रमाण पत्र क्रमांक (स्वचालित - 5 अंक)</label>
            <input type="text" id="certNoAuto" readonly style="background: rgba(0,242,255,0.1); color: var(--primary); font-weight: bold; letter-spacing: 1px;">
          </div>
        </div>

        <div id="manual-numbers" class="hidden">
          <div class="form-group">
            <label>आवेदन क्रमांक (मैन्युअल)</label>
            <input type="text" id="appNoManual">
          </div>
          <div class="form-group">
            <label>प्रमाण पत्र क्रमांक (मैन्युअल)</label>
            <input type="text" id="certNoManual">
          </div>
        </div>

        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 30px;">
          <button type="button" class="btn btn-secondary" onclick="showDashboard()">वापस</button>
          <button type="submit" class="btn">💾 सबमिट करें</button>
        </div>
      </form>
    </div>
  </div>

  <!-- List View -->
  <div id="list-view" class="container hidden">
    <div class="glass-card">
      <h2>आवेदन सूची</h2>
      <button class="btn btn-secondary" style="margin-bottom: 20px; padding: 10px 20px; font-size: 14px;" onclick="showDashboard()">⬅ वापस डैशबोर्ड</button>
      <table class="data-table">
        <thead>
          <tr>
            <th>आवेदक का नाम</th>
            <th>आवेदन क्र.</th>
            <th>प्रमाण पत्र क्र.</th>
            <th>कार्य</th>
          </tr>
        </thead>
        <tbody id="list-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Print Area -->
  <div id="print-area" class="hidden"></div>

let applications = [];
let currentPhotoBase64 = "";

window.onload = function() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('issueDate').value = today;
  
  const districtSelect = document.getElementById('district');
  for (let dist in districtData) {
    let option = document.createElement('option');
    option.value = dist;
    option.text = dist;
    districtSelect.add(option);
  }
  districtSelect.value = "देवरिया";
  updateTehsilOptions();
  generateAutoNumbers();
};

function login() {
  if (document.getElementById('login-id').value === 'admin' && document.getElementById('login-pass').value === 'admin') {
    hideAllViews();
    document.getElementById('dashboard-view').classList.remove('hidden');
  } else {
    alert('कृपया सही ID और Password दर्ज करें!\n(Default: admin / admin)');
  }
}

function showDashboard() { hideAllViews(); document.getElementById('dashboard-view').classList.remove('hidden'); }
function showForm() { hideAllViews(); document.getElementById('form-view').classList.remove('hidden'); generateAutoNumbers(); }
function showList() { hideAllViews(); document.getElementById('list-view').classList.remove('hidden'); renderList(); }
function hideAllViews() {
  ['login-view', 'dashboard-view', 'form-view', 'list-view'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
}

function updateTehsilOptions() {
  const dist = document.getElementById('district').value;
  const tehsilInput = document.getElementById('tehsil');
  const datalist = document.getElementById('tehsil-list');
  datalist.innerHTML = '';
  
  if (districtData[dist]) {
    districtData[dist].forEach(t => {
      let option = document.createElement('option');
      option.value = t;
      datalist.appendChild(option);
    });
  }
  tehsilInput.value = (dist === "देवरिया") ? "रूद्रपुर" : "";
}

function toggleAreaType() {
  const type = document.querySelector('input[name="areaType"]:checked').value;
  document.getElementById('rural-fields').classList.toggle('hidden', type !== 'ग्रामीण');
}

function toggleManualNumbers() {
  const isManual = document.getElementById('manualNumbers').checked;
  document.getElementById('auto-numbers').classList.toggle('hidden', isManual);
  document.getElementById('manual-numbers').classList.toggle('hidden', !isManual);
  if (!isManual) generateAutoNumbers();
}

function generateAutoNumbers() {
  const random6 = Math.floor(100000 + Math.random() * 900000); // 6 unique digits
  const random5 = Math.floor(10000 + Math.random() * 90000);   // 5 digits
  document.getElementById('appNoAuto').value = "2619000" + random6;
  document.getElementById('certNoAuto').value = random5.toString();
}

function previewPhoto(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      currentPhotoBase64 = e.target.result;
      const img = document.getElementById('photoPreview');
      img.src = currentPhotoBase64;
      img.style.display = 'block';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function formatDate(dateString) {
  if (!dateString) return "";
  const d = new Date(dateString);
  return d.getDate().toString().padStart(2, '0') + '/' + (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getFullYear();
}

function submitForm() {
  const isManual = document.getElementById('manualNumbers').checked;
  const appNo = isManual ? document.getElementById('appNoManual').value : document.getElementById('appNoAuto').value;
  const certNo = isManual ? document.getElementById('certNoManual').value : document.getElementById('certNoAuto').value;

  if (!appNo || !certNo) { alert("कृपया आवेदन और प्रमाण पत्र क्रमांक दर्ज करें।"); return; }

  applications.push({
    district: document.getElementById('district').value,
    tehsil: document.getElementById('tehsil').value,
    areaType: document.querySelector('input[name="areaType"]:checked').value,
    mohalla: document.getElementById('mohalla').value,
    gram: document.getElementById('gram').value,
    thana: document.getElementById('thana').value,
    issueDate: formatDate(document.getElementById('issueDate').value),
    applicantName: document.getElementById('applicantName').value,
    fatherName: document.getElementById('fatherName').value,
    motherName: document.getElementById('motherName').value,
    officerName: document.getElementById('officerName').value,
    photo: currentPhotoBase64 || "https://via.placeholder.com/96?text=Photo",
    appNo: appNo,
    certNo: certNo
  });

  alert("✅ आवेदन सफलतापूर्वक सबमिट हो गया!");
  showList();
}

function renderList() {
  const tbody = document.getElementById('list-tbody');
  tbody.innerHTML = '';
  applications.forEach((app, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${app.applicantName}</td>
      <td style="font-family: monospace; color: var(--primary);">${app.appNo}</td>
      <td style="font-family: monospace; color: var(--primary);">${app.certNo}</td>
      <td><button class="btn" style="padding: 8px 20px; font-size: 14px;" onclick="printCertificate(${index})">🖨️ Print</button></td>
    `;
    tbody.appendChild(tr);
  });
}
