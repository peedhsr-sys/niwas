<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Certificate Editor & Viewer</title>
  <style>
    /* ---------------- UI Styling ---------------- */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
    }

    /* प्रिंट के समय बटन छुपाने के लिए */
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: #fff;
        margin: 0;
      }
      .certificate-container {
        border: none !important;
        box-shadow: none !important;
      }
    }

    /* बटन ग्रुप स्टाइलिंग */
    .button-group {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
    }

    .btn-print { background-color: #007bff; }
    .btn-save { background-color: #28a745; }
    .btn-reset { background-color: #dc3545; }
    .btn-getphoto { background-color: #17a2b8; }

    .btn:hover { opacity: 0.9; }

    /* सर्टिफिकेट कंटेनर */
    .certificate-container {
      width: 800px;
      background: #fff;
      padding: 30px;
      border: 1px solid #ccc;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin: 0 auto;
      position: relative;
    }

    .input-field {
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 250px;
    }

    /* फोटो और QR बॉक्स का पिक्सल साइज बिल्कुल फिक्स (1 पिक्सल भी चेंज नहीं होगा) */
    .photo-box {
      width: 130px;
      height: 150px;
      border: 2px dashed #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      background-color: #fafafa;
    }

    .photo-box img {
      width: 130px;
      height: 150px;
      object-fit: cover;
    }

    .qr-box {
      width: 120px;
      height: 120px;
      border: 2px dashed #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      background-color: #fafafa;
    }

    .qr-box img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }

    .flex-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- 4 कंट्रोल बटन -->
  <div class="button-group no-print">
    <button class="btn btn-print" onclick="triggerPrint()">Print</button>
    <button class="btn btn-save" onclick="saveData()">Save</button>
    <button class="btn btn-reset" onclick="resetData()">Reset</button>
    <button class="btn btn-getphoto" onclick="getPhotoFromEDistrict()">Get Photo</button>
  </div>

  <!-- सर्टिफिकेट लेआउट -->
  <div class="certificate-container" id="certContainer">
    <h2>eDistrict प्रमाणपत्र / फॉर्म</h2>
    
    <div style="margin-bottom: 15px;">
      <label for="appNoInput"><strong>आवेदन संख्या (Application Number):</strong> </label>
      <input type="text" id="appNoInput" class="input-field" value="261900010064472" placeholder="आवेदन संख्या दर्ज करें">
    </div>

    <!-- संपादन योग्य विवरण -->
    <div contenteditable="true" id="editableContent" style="padding: 10px; border: 1px solid #eee; min-height: 80px; margin-bottom: 20px;">
      यहाँ पर आप अपना कोई भी विवरण टाइप या एडिट कर सकते हैं। यह सेव करने पर वैसा ही रहेगा।
    </div>

    <div class="flex-row">
      <!-- फोटो सेक्शन (क्लिक करने पर अपलोड) -->
      <div>
        <p><strong>फोटो (क्लिक करके अपलोड करें):</strong></p>
        <div class="photo-box" onclick="document.getElementById('photoInput').click()">
          <img id="userPhoto" src="https://via.placeholder.com/130x150?text=Click+to+Upload" alt="Photo">
        </div>
        <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="previewImage(this, 'userPhoto')">
      </div>

      <!-- QR कोड सेक्शन (क्लिक करने पर अपलोड, सेम साइज़) -->
      <div>
        <p><strong>QR कोड (क्लिक करके अपलोड करें):</strong></p>
        <div class="qr-box" onclick="document.getElementById('qrInput').click()">
          <img id="userQR" src="https://via.placeholder.com/120x120?text=Upload+QR" alt="QR Code">
        </div>
        <input type="file" id="qrInput" accept="image/*" style="display:none;" onchange="previewImage(this, 'userQR')">
      </div>
    </div>
  </div>

  <script>
    // 1. प्रिंट फंक्शन (404 Error से बचाव)
    function triggerPrint() {
      window.print();
    }

    // 2. गेट फोटो फंक्शन (Application Number के आधार पर URL जनरेट करेगा)
    function getPhotoFromEDistrict() {
      const appNo = document.getElementById('appNoInput').value.trim();
      if (!appNo) {
        alert("कृपया आवेदन संख्या (Application Number) दर्ज करें!");
        return;
      }
      const photoUrl = `https://edistrict.up.gov.in/edistrict/showphotoCert.aspx?appid=${appNo}`;
      document.getElementById('userPhoto').src = photoUrl;
    }

    // 3. PC से इमेज/QR अपलोड (साइज़ में 1px का भी अंतर नहीं आएगा)
    function previewImage(input, targetId) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          document.getElementById(targetId).src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // 4. डाटा सेव करना (LocalStorage)
    function saveData() {
      const certData = {
        appNo: document.getElementById('appNoInput').value,
        content: document.getElementById('editableContent').innerHTML,
        photoSrc: document.getElementById('userPhoto').src,
        qrSrc: document.getElementById('userQR').src
      };
      localStorage.setItem('savedCertData', JSON.stringify(certData));
      alert("डाटा सफलतापूर्वक सेव हो गया है! रीसेट करने तक यह सेव रहेगा।");
    }

    // 5. डाटा रीसेट करना
    function resetData() {
      if (confirm("क्या आप सेव किया गया डाटा रीसेट करना चाहते हैं?")) {
        localStorage.removeItem('savedCertData');
        location.reload();
      }
    }

    // 6. पेज लोड होने पर सेव डाटा ऑटो-लोड करना
    window.addEventListener('DOMContentLoaded', () => {
      const savedData = localStorage.getItem('savedCertData');
      if (savedData) {
        const certData = JSON.parse(savedData);
        if (certData.appNo) document.getElementById('appNoInput').value = certData.appNo;
        if (certData.content) document.getElementById('editableContent').innerHTML = certData.content;
        if (certData.photoSrc) document.getElementById('userPhoto').src = certData.photoSrc;
        if (certData.qrSrc) document.getElementById('userQR').src = certData.qrSrc;
      }
    });
  </script>
</body>
</html>
