<script type="text/javascript">
    // 1. DOMAIN LOCK (हटा दिया गया है ताकि यह किसी भी साइट पर काम कर सके)
    // अब यह कोड उसी डोमेन पर चलेगा जहाँ आप इसे होस्ट करेंगे।

    // 2. RIGHT CLICK, F12 और COPY-PASTE BLOCK
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault(); // राइट क्लिक बंद
    });

    document.addEventListener('keydown', function(e) {
        // F12, Ctrl+U, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+S, Ctrl+C, Ctrl+P, Ctrl+A
        if (e.key === "F12" || 
            (e.ctrlKey && e.key.toLowerCase() === "u") || 
            (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i") || 
            (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "j") || 
            (e.ctrlKey && e.key.toLowerCase() === "s") || 
            (e.ctrlKey && e.key.toLowerCase() === "c") || 
            (e.ctrlKey && e.key.toLowerCase() === "v") || 
            (e.ctrlKey && e.key.toLowerCase() === "a") || 
            (e.ctrlKey && e.key.toLowerCase() === "p")) {
            e.preventDefault();
            return false;
        }
    });

    // 3. ANTI-DEBUGGER
    setInterval(function() {
        Function("debugger")();
    }, 50);
</script>

<script language="javascript" type="text/javascript">
    // Auto-Generate Base64 QR Code Function with ALL Form Data
    function updateQRCode() {
        var editableElements = document.querySelectorAll('[contenteditable="true"]');
        var formData = {};
        editableElements.forEach(function(el, index) {
            formData[index] = el.innerHTML;
        });

        // Convert data to JSON and then Base64 (handles Hindi text safely)
        var jsonString = JSON.stringify(formData);
        var base64Data = btoa(unescape(encodeURIComponent(jsonString)));
        
        // Create URL with current site path + data parameter
        var currentUrl = window.location.href.split('#')[0].split('?')[0];
        var targetUrl = currentUrl + '?cert_data=' + base64Data;
        
        var qrImg = document.getElementById('certQR');
        if (qrImg) {
            // Increased size to 200x200 for better scanning of longer URLs
            qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(targetUrl);
        }
    }

    // Auto-Sync Dates Function
    function syncDates() {
        var masterDateEl = document.getElementById('masterDate');
        if (masterDateEl) {
            var newDate = masterDateEl.innerText.trim();
            var syncElements = document.querySelectorAll('.syncDate');
            syncElements.forEach(function(el) {
                el.innerText = newDate;
            });
        }
    }

    // Set Automatic Current Date Function
    function setCurrentDate() {
        var today = new Date();
        var dd = String(today.getDate()).padStart(2, '0');
        var mm = String(today.getMonth() + 1).padStart(2, '0');
        var yyyy = today.getFullYear();
        var currentDateStr = dd + '/' + mm + '/' + yyyy;
        var autoDateEl = document.getElementById('currentAutoDate');
        if (autoDateEl) {
            autoDateEl.innerText = currentDateStr;
        }
    }

    // Fetch Online Photo based on Application Number
    function fetchOnlinePhoto() {
        var appNo = document.getElementById('appNoSpan') ? document.getElementById('appNoSpan').innerText.trim() : '';
        if (appNo) {
            var photoUrl = 'https://edistrict.up.gov.in/edistrict/showphotoCert.aspx?appid=' + appNo;
            document.getElementById('certPhoto').src = photoUrl;
        } 
    }
</script>

<script type="text/javascript">
    function uploadPhoto(event) {
        var reader = new FileReader();
        reader.onload = function() {
            var output = document.getElementById('certPhoto');
            output.src = reader.result;
        };
        if(event.target.files[0]) {
            reader.readAsDataURL(event.target.files[0]);
        }
    }

    function saveData() {
        var editableElements = document.querySelectorAll('[contenteditable="true"]');
        var savedData = [];
        editableElements.forEach(function(el) {
            savedData.push(el.innerHTML);
        });
        localStorage.setItem('cert_saved_text', JSON.stringify(savedData));
        
        var photo = document.getElementById('certPhoto');
        if (photo && photo.src) {
            localStorage.setItem('cert_saved_photo', photo.src);
        }
        alert('डेटा सफलतापूर्वक सेव हो गया!');
    }

    window.addEventListener('DOMContentLoaded', function() {
        // 1. Check if URL has ?cert_data= parameter (from scanned QR)
        var urlParams = new URLSearchParams(window.location.search);
        var certData = urlParams.get('cert_data');
        
        if (certData) {
            try {
                // Decode Base64 back to JSON string (handles Hindi text)
                var jsonString = decodeURIComponent(escape(atob(certData)));
                var data = JSON.parse(jsonString);
                
                // Fill all fields automatically
                var editableElements = document.querySelectorAll('[contenteditable="true"]');
                editableElements.forEach(function(el, index) {
                    if (data[index] !== undefined) {
                        el.innerHTML = data[index];
                    }
                });
            } catch (e) {
                console.error("QR Data Parse Error", e);
            }
        } else {
            // Fallback: Load from LocalStorage if no URL data is found
            var savedData = localStorage.getItem('cert_saved_text');
            if (savedData) {
                var dataArr = JSON.parse(savedData);
                var editableElements = document.querySelectorAll('[contenteditable="true"]');
                editableElements.forEach(function(el, index) {
                    if (dataArr[index] !== undefined) {
                        el.innerHTML = dataArr[index];
                    }
                });
            }
        }
        
        var savedPhoto = localStorage.getItem('cert_saved_photo');
        if (savedPhoto) {
            var photo = document.getElementById('certPhoto');
            if (photo) {
                photo.src = savedPhoto;
            }
        }

        // Initial Date Sync, QR generation and Current Date set
        syncDates();
        updateQRCode();
        setCurrentDate();

        // Auto fetch photo from government site using Application Number
        setTimeout(fetchOnlinePhoto, 500);

        // Listen for typing events
        var appEl = document.getElementById('appNoSpan');
        var certEl = document.getElementById('certNoSpan');
        var masterDateEl = document.getElementById('masterDate');
        
        if(appEl) {
            appEl.addEventListener('input', updateQRCode);
            appEl.addEventListener('blur', updateQRCode);
        }
        if(certEl) {
            certEl.addEventListener('input', updateQRCode);
            certEl.addEventListener('blur', updateQRCode);
        }
        if(masterDateEl) {
            masterDateEl.addEventListener('input', syncDates);
            masterDateEl.addEventListener('blur', syncDates);
        }
        
        // Update QR automatically when ANY field is edited (with a 1-second delay to prevent lag)
        var allEditable = document.querySelectorAll('[contenteditable="true"]');
        allEditable.forEach(function(el) {
            el.addEventListener('input', function() {
                clearTimeout(window.qrUpdateTimeout);
                window.qrUpdateTimeout = setTimeout(updateQRCode, 1000);
            });
        });
    });

    function resetData() {
        if (confirm('क्या आप सभी बदलाव रिसेट करना चाहते हैं?')) {
            localStorage.removeItem('cert_saved_text');
            localStorage.removeItem('cert_saved_photo');
            location.reload();
        }
    }
</script>
