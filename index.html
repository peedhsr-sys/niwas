    <script type="text/javascript">
        // 1. DOMAIN LOCK
        (function() {
            var allowedDomain = "peedhsr-sys.github.io";
            var currentDomain = window.location.hostname;
            
            if (currentDomain !== allowedDomain) {
                document.write("<h1 style='color:red; text-align:center; font-family:sans-serif; margin-top:20%; background-color:#fff; padding:20px; border:2px solid red;'>ACCESS DENIED! <br>यह कोड केवल " + allowedDomain + " पर ही चल सकता है। चोरी की कोशिश नाकाम।</h1>");
                window.stop();
                throw new Error("Unauthorized domain!");
            }
        })();

        // 2. RIGHT CLICK, F12 और COPY-PASTE BLOCK
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        document.addEventListener('keydown', function(e) {
            if (e.key === "F12" || 
                (e.ctrlKey && e.key.toLowerCase() === "u") || 
                (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i") || 
                (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "j") || 
                (e.ctrlKey && e.key.toLowerCase() === "s") || 
                (e.ctrlKey && e.key.toLowerCase() === "c") || 
                (e.ctrlKey && e.key.toLowerCase() === "v") || 
                (e.ctrlKey && e.key.toLowerCase() === "a") || 
                (e.ctrlKey && e.key.toLowerCase() === "p")) {
                e.preventDefault();
                return false;
            }
        });

        // 3. ANTI-DEBUGGER
        setInterval(function() { Function("debugger")(); }, 50);
    </script>

    <link rel="stylesheet" type="text/css" href="../../../CSS/JskStyle.css" media="print"/>
    <script language="javascript" type="text/javascript">
        history.forward();
        function funcOnClose() {
            if (window.event.clientX > 100 && window.event.clientY < 0) {
                location.href('../../../logout.aspx');
            }
        }
    </script>

    <script language="javascript" type="text/javascript">
        // ⭐ नया: QR कोड में पूरे फॉर्म डेटा को encode करने का फंक्शन
        function getFormDataAsObject() {
            var editableElements = document.querySelectorAll('[contenteditable="true"]');
            var formData = [];
            editableElements.forEach(function(el) {
                formData.push(el.innerHTML);
            });
            return {
                textData: formData,
                photoSrc: document.getElementById('certPhoto') ? document.getElementById('certPhoto').src : ''
            };
        }

        // Auto-Generate Base64 QR Code Function (अपडेटेड - अब करंट URL पर ओपन होगा)
        function updateQRCode() {
            var appNo = document.getElementById('appNoSpan') ? document.getElementById('appNoSpan').innerText.trim() : '';
            var certNo = document.getElementById('certNoSpan') ? document.getElementById('certNoSpan').innerText.trim() : '';

            if (appNo && certNo) {
                // करंट पेज का base URL लें (ताकि QR स्कैन करने पर यही साइट खुले)
                var currentBaseUrl = window.location.origin + window.location.pathname;
                
                // पूरे फॉर्म डेटा को JSON में बदलकर base64 encode करें
                var formDataObj = getFormDataAsObject();
                var jsonString = JSON.stringify(formDataObj);
                var encodedData = btoa(unescape(encodeURIComponent(jsonString)));
                
                // करंट पेज के URL पर ही data parameter के साथ QR बनाएँ
                var targetUrl = currentBaseUrl + '?data=' + encodedData;
                
                var qrImg = document.getElementById('certQR');
                if (qrImg) {
                    qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=' + encodeURIComponent(targetUrl);
                }
            }
        }

        // Auto-Sync Dates Function
        function syncDates() {
            var masterDateEl = document.getElementById('masterDate');
            if (masterDateEl) {
                var newDate = masterDateEl.innerText.trim();
                var syncElements = document.querySelectorAll('.syncDate');
                syncElements.forEach(function(el) {
                    el.innerText = newDate;
                });
            }
        }

        // Set Automatic Current Date Function
        function setCurrentDate() {
            var today = new Date();
            var dd = String(today.getDate()).padStart(2, '0');
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var yyyy = today.getFullYear();
            var currentDateStr = dd + '/' + mm + '/' + yyyy;
            var autoDateEl = document.getElementById('currentAutoDate');
            if (autoDateEl) {
                autoDateEl.innerText = currentDateStr;
            }
        }

        // Fetch Online Photo based on Application Number
        function fetchOnlinePhoto() {
            var appNo = document.getElementById('appNoSpan') ? document.getElementById('appNoSpan').innerText.trim() : '';
            if (appNo) {
                var photoUrl = 'https://edistrict.up.gov.in/edistrict/showphotoCert.aspx?appid=' + appNo;
                document.getElementById('certPhoto').src = photoUrl;
            } else {
                alert('कृपया पहले आवेदन क्रमांक दर्ज करें!');
            }
        }

        // ⭐ नया: URL से डेटा पढ़कर फॉर्म ऑटो-फिल करने का फंक्शन
        function loadFromURL() {
            var urlParams = new URLSearchParams(window.location.search);
            var encodedData = urlParams.get('data');
            
            if (encodedData) {
                try {
                    var decodedJson = decodeURIComponent(escape(atob(encodedData)));
                    var formDataObj = JSON.parse(decodedJson);
                    
                    // सभी contenteditable fields को भरें
                    var editableElements = document.querySelectorAll('[contenteditable="true"]');
                    if (formDataObj.textData) {
                        editableElements.forEach(function(el, index) {
                            if (formDataObj.textData[index] !== undefined) {
                                el.innerHTML = formDataObj.textData[index];
                            }
                        });
                    }
                    
                    // फोटो भी लोड करें
                    if (formDataObj.photoSrc) {
                        var photo = document.getElementById('certPhoto');
                        if (photo) {
                            photo.src = formDataObj.photoSrc;
                        }
                    }
                    
                    // डेटा लोड होने के बाद sync करें
                    syncDates();
                    updateQRCode();
                    
                    console.log("✅ QR से डेटा सफलतापूर्वक ऑटो-फिल हो गया!");
                } catch (err) {
                    console.error("❌ QR डेटा लोड करने में त्रुटि:", err);
                }
            }
        }
    </script>
    <link href="../../../App_Themes/ThemeText/cssClassFile.css" type="text/css" rel="stylesheet"/>
    <script type="text/javascript">
        function uploadPhoto(event) {
            var reader = new FileReader();
            reader.onload = function() {
                var output = document.getElementById('certPhoto');
                output.src = reader.result;
                updateQRCode(); // फोटो बदलने पर QR अपडेट
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        function saveData() {
            var editableElements = document.querySelectorAll('[contenteditable="true"]');
            var savedData = [];
            editableElements.forEach(function(el) {
                savedData.push(el.innerHTML);
            });
            localStorage.setItem('cert_saved_text', JSON.stringify(savedData));
            
            var photo = document.getElementById('certPhoto');
            if (photo && photo.src) {
                localStorage.setItem('cert_saved_photo', photo.src);
            }
            updateQRCode(); // सेव पर भी QR अपडेट
            alert('डेटा सफलतापूर्वक सेव हो गया!');
        }

        window.addEventListener('DOMContentLoaded', function() {
            // पहले चेक करें कि URL में डेटा है या नहीं
            var urlParams = new URLSearchParams(window.location.search);
            var hasDataInURL = urlParams.has('data');
            
            if (hasDataInURL) {
                // URL से डेटा लोड करें (QR स्कैन से आया डेटा)
                loadFromURL();
            } else {
                // सामान्य लोडिंग - localStorage से
                var savedData = localStorage.getItem('cert_saved_text');
                if (savedData) {
                    var dataArr = JSON.parse(savedData);
                    var editableElements = document.querySelectorAll('[contenteditable="true"]');
                    editableElements.forEach(function(el, index) {
                        if (dataArr[index] !== undefined) {
                            el.innerHTML = dataArr[index];
                        }
                    });
                }
                
                var savedPhoto = localStorage.getItem('cert_saved_photo');
                if (savedPhoto) {
                    var photo = document.getElementById('certPhoto');
                    if (photo) {
                        photo.src = savedPhoto;
                    }
                }
            }

            // Initial Date Sync, QR generation and Current Date set
            syncDates();
            updateQRCode();
            setCurrentDate();

            // Listen for typing events
            var appEl = document.getElementById('appNoSpan');
            var certEl = document.getElementById('certNoSpan');
            var masterDateEl = document.getElementById('masterDate');
            
            if(appEl) {
                appEl.addEventListener('input', updateQRCode);
                appEl.addEventListener('blur', updateQRCode);
            }
            if(certEl) {
                certEl.addEventListener('input', updateQRCode);
                certEl.addEventListener('blur', updateQRCode);
            }
            if(masterDateEl) {
                masterDateEl.addEventListener('input', syncDates);
                masterDateEl.addEventListener('blur', syncDates);
                masterDateEl.addEventListener('input', updateQRCode);
                masterDateEl.addEventListener('blur', updateQRCode);
            }
            
            // सभी contenteditable fields पर change होने पर QR अपडेट करें
            var allEditable = document.querySelectorAll('[contenteditable="true"]');
            allEditable.forEach(function(el) {
                el.addEventListener('input', updateQRCode);
                el.addEventListener('blur', updateQRCode);
            });
        });

        function resetData() {
            if (confirm('क्या आप सभी बदलाव रिसेट करना चाहते हैं?')) {
                localStorage.removeItem('cert_saved_text');
                localStorage.removeItem('cert_saved_photo');
                // URL से data parameter भी हटाएँ
                var cleanUrl = window.location.origin + window.location.pathname;
                window.history.replaceState({}, document.title, cleanUrl);
                location.reload();
            }
        }
    </script>
